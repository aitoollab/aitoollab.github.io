<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>页面不存在｜AiToollab</title>

    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.8; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        a { color: var(--accent); text-decoration: none; }
        .header { border-bottom: 1px solid var(--border); background: rgba(13,17,23,.9); position: sticky; top: 0; z-index: 10; }
        .main-nav { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--text); }
        .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
        .nav-link { color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 14px; }
        .nav-link:hover { color: var(--text); background: var(--card); }
        .nav-link-cta { color: #052e16; background: var(--green); font-weight: 600; }
        .nav-link-cta:hover { background: #2ea043; color: #052e16; }
        .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
        .box { text-align: center; max-width: 560px; }
        .code { font-size: 72px; font-weight: 800; background: linear-gradient(135deg, #58a6ff, #a371f7); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2; }
        h1 { font-size: 24px; margin: 8px 0 12px; }
        .desc { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 12px 28px; border-radius: 10px; font-weight: 700; font-size: 15px; }
        .btn-primary { background: var(--green); color: #052e16; }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary { border: 1px solid var(--border); color: var(--text); background: var(--card); }
        .btn-secondary:hover { border-color: var(--accent); }
        .footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
        .footer a { color: var(--muted); }
        @media (max-width: 600px) { .code { font-size: 56px; } }
    </style>
</head>

        <div class="actions">
